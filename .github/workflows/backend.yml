name: Backend Java
on:
  push:
    paths: ["backend-java/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend-java/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: suit_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: suit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suit_test -d suit_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw
      - name: Testes unitários e integração PostgreSQL
        run: ./mvnw -B verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/suit_test -Dspring.datasource.username=suit_test -Dspring.datasource.password=ci-local-only
