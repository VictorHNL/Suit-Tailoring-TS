# Ambiente LOCAL. O perfil dev habilita simulações e cookies HTTP.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suit_tailoring
      POSTGRES_USER: suit_tailoring
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suit_tailoring -d suit_tailoring"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend-java
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/suit_tailoring
      DB_USER: suit_tailoring
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      APP_JOBS_ENABLED: "false"
      MEDIA_DIRECTORY: /app/storage/media
    volumes:
      - media_data:/app/storage/media
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend-java
    environment:
      DB_URL: jdbc:postgresql://db:5432/suit_tailoring
      DB_USER: suit_tailoring
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: worker
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
